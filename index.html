 try{lastDisk=localStorage.getItem(key());if(lastDisk){const data=JSON.parse(lastDisk);s=E.validate(data.event??data);s.demo=demoMode;clock=readClock(data.clock,s);history=[];for(const h of (Array.isArray(data.undo)?data.undo:[]).slice(-20)){try{const state=E.validate(h.event);history.push({event:state,clock:readClock(h.clock,state)});}catch{}}}else{s=E.fresh();clock=null;history=[];}}
 catch(e){if(lastDisk){blockedRaw=lastDisk;s=E.fresh();history=[];clock=null;}else storageError=true;}
 if(!clock)clock=newClock();ui.round=Math.max(0,s.rounds.length-1);ui.tab=s.finished?'standings':s.rounds.length?'pairings':'setup';
}
function ensureLatest(){
 if(blockedRaw)throw Error('Recover or discard the unreadable saved event in Backups before making changes.');
 if(conflict)throw Error('This event changed in another tab. Load the latest saved copy before editing.');
 try{const raw=localStorage.getItem(key());if(raw!==lastDisk){conflict=true;renderBanners();throw Error('This event changed in another tab. Load the latest copy first.');}}catch(e){if(conflict)throw e;storageError=true;}
}
function persist(){
 try{const raw=JSON.stringify({format:'podkeeper',version:1,event:s,clock,undo:history.slice(-20)});localStorage.setItem(key(),raw);lastDisk=raw;storageError=false;}
 catch{storageError=true;}
 renderSaveState();renderBanners();
}
function log(message){s.log.push({at:new Date().toISOString(),message});s.log=s.log.slice(-500);}
function change(message,fn,{render=true}={}){
 ensureLatest();const before={event:clone(s),clock:clone(clock)};history.push(before);
 try{fn(s);s.revision++;log(message);history=history.slice(-20);persist();if(render)renderAll();}
 catch(e){s=before.event;clock=before.clock;history.pop();throw e;}
}
function undo(){
 if(!history.length)return;ensureLatest();const before=history.pop(),liveClock=clock;
 s=before.event;s.demo=demoMode;clock=liveClock?.roundId===(s.rounds.at(-1)?.id??null)&&liveClock?.eventId===s.id?liveClock:(before.clock||newClock());s.revision++;log('Undid the previous action.');
 ui.round=Math.min(ui.round,Math.max(0,s.rounds.length-1));if(!s.rounds.length&&['pairings','standings','players'].includes(ui.tab))ui.tab='setup';if(s.finished)ui.tab='standings';
 persist();closeModal();renderAll();toast('Previous action undone.');
}
function renderSaveState(){const el=$('#save-state');if(el)el.innerHTML=`<span class="save-dot ${storageError||blockedRaw||conflict?'warning':''}"></span>${conflict?'Changed in another tab':blockedRaw?'Recovery needed':storageError?'Export to save':'Saved on this device'}`;const u=$('[data-action="undo"]');if(u)u.disabled=!history.length||!!blockedRaw||conflict;}
function renderBanners(){
 const b=$('#banner-area');if(!b)return;let html='';
 if(blockedRaw)html=`<div class="notice red event-banner"><span>${icon('alert')} The saved event could not be read. Its data has not been overwritten.</span>${btn('Recover data','backups','small-btn')}</div>`;
 else if(conflict)html=`<div class="notice gold event-banner"><span>${icon('alert')} Another tab changed this event. Editing is paused to protect your results.</span>${btn('Load latest','reload','small-btn')}</div>`;
 else if(storageError)html=`<div class="notice gold event-banner"><span>${icon('alert')} Automatic saving is unavailable here. Export a backup before closing this page.</span>${btn('Export backup','export-json','small-btn')}</div>`;
 if(demoMode)html+=`<div class="notice event-banner"><span><strong>Demo event.</strong> Explore freely. Your own tournament is untouched.</span>${btn('Exit demo '+icon('exit'),'exit-demo','small-btn')}</div>`;
 b.innerHTML=html;
}
function toast(message,error=false,withUndo=false){clearTimeout(toastHandle);const el=$('#toast');el.className='toast visible'+(error?' error':'');el.innerHTML=`<span>${esc(message)}</span>${withUndo?'<button type="button" data-action="undo">Undo</button>':''}`;toastHandle=setTimeout(()=>el.classList.remove('visible'),error?8000:4500);}
function renderTopbar(){
 $('#topbar').innerHTML=`<div class="brand"><div class="brand-mark">${icon('cards')}</div><div><div class="brand-name">podkeeper<span style="color:var(--green)">.</span></div><div class="brand-note">YOUR DRAFT, IN GOOD ORDER.</div></div></div><div class="tools"><span class="save-state" id="save-state"></span>${btn(icon('undo')+'<span class="tool-text">Undo</span>','undo','ghost','title="Undo last action (Ctrl / ⌘ Z)" aria-label="Undo last action"'+(!history.length?' disabled':''))}${btn(icon(preferences.theme==='dark'?'sun':'moon'),'theme','ghost icon-btn','aria-label="Toggle light and dark theme" title="Toggle theme"')}${btn(icon('help'),'rules','ghost icon-btn rules-tool','aria-label="Scoring rules and help" title="Scoring rules (?)"')}${btn(icon('download')+'<span class="tool-text">Backups</span>','backups','','aria-label="Backups and exports"')}</div>`;
 renderSaveState();
}
function hero(){
 const active=s.players.filter(p=>p.active).length,played=s.rounds.length,status=s.finished?'TOURNAMENT COMPLETE':played?'THE TOURNAMENT DESK':'LET’S GET A GOOD DRAFT GOING';
 return `<section class="hero"><div><div class="eyebrow muted">${status}</div><h1 id="hero-name">${esc(s.name)}</h1><p>${s.finished?'Every match reported. Every tiebreaker accounted for.':played?'Less scorekeeping. More playing Magic.':'Bring the players. We’ll keep the rounds in order.'}</p></div><div class="hero-right"><span class="chip neutral">${icon('cards')} MTG · Swiss</span><div class="event-stats"><div class="event-stat"><b class="num">${active.toString().padStart(2,'0')}</b><span>Players${s.players.length!==active?' active':''}</span></div><div class="event-stat"><b class="num">${played||s.settings.rounds}${played?`<span style="font-size:14px;letter-spacing:0"> / ${s.settings.rounds}</span>`:''}</b><span>${played?'Round':'Rounds'}</span></div>${ui.board?'<div class="event-stat"><b data-clock style="font-size:30px"></b><span>Round clock</span></div>':''}</div></div></section>`;
}
function tabs(){
 const a=s.rounds.length?[['pairings','Pairings','grid'],['standings','Standings','trophy'],['players','Players <span class="long-label">& pods</span>','users'],['log','Activity','activity']]:[['setup','Event setup','users'],['pods','Draft seats','cards'],['standings','Standings','trophy'],['log','Activity','activity']];
 return `<nav class="tabs" aria-label="Tournament views">${a.map(([id,label,ic])=>`<button type="button" class="tab ${ui.tab===id?'active':''}" data-action="tab" data-tab="${id}" aria-current="${ui.tab===id?'page':'false'}" ${id==='standings'&&!s.rounds.length?'disabled':''}>${icon(ic)}${label}${id==='pairings'?`<span class="tab-count">${latestRound().matches.filter(m=>!m.result).length}</span>`:''}</button>`).join('')}</nav>`;
}
function footer(){return `<footer class="footer"><span>${icon('lock')} Offline tournament desk · no accounts, no uploads.</span><button type="button" class="text-btn" data-action="rules">Scoring & help ${icon('external')}</button></footer>`;}
function renderAll(){
 const focus=document.activeElement,focusId=focus?.id,selection=typeof focus?.selectionStart==='number'?[focus.selectionStart,focus.selectionEnd]:null,scroll=window.scrollY;
 document.documentElement.dataset.theme=preferences.theme;document.title=`${s.name} · Podkeeper`;renderTopbar();renderBanners();
 let body=ui.tab==='setup'?setupView():ui.tab==='pairings'?pairingsView():ui.tab==='standings'?standingsView():ui.tab==='players'||ui.tab==='pods'?playersView():logView();
 $('#main').innerHTML=hero()+tabs()+body+footer();
 document.body.classList.toggle('board-view',ui.board);let exit=$('#board-exit');if(ui.board&&!exit){exit=document.createElement('div');exit.id='board-exit';exit.className='board-exit';exit.innerHTML=btn(icon('exit')+' Exit display','display','primary');document.body.appendChild(exit);}else if(!ui.board&&exit)exit.remove();
 tick();
 if(focusId){const next=document.getElementById(focusId);if(next){next.focus({preventScroll:true});if(selection&&next.setSelectionRange){try{next.setSelectionRange(...selection);}catch{}}}}
 window.scrollTo({top:scroll,behavior:'instant'});
}
function ruleCard(){return `<section class="rule-card"><div class="eyebrow">FAIR STANDINGS, NO SPREADSHEET</div><h3>The tie is in<br>the details.</h3><div class="rule-chain"><span>Points</span> → <span>OMW%</span> → <span>GW%</span> → <span>OGW%</span></div><p>Tap any player to see their record and the opponents behind their tiebreakers.</p><button type="button" class="text-btn" data-action="rules">How scoring works ${icon('arrow')}</button></section>`;}
function setupSettings(){
 const options=(vals,current,suffix='')=>vals.map(v=>`<option value="${v}" ${v===current?'selected':''}>${v}${suffix}</option>`).join('');
 const durations=[...new Set([25,30,40,45,50,60,75,90,s.settings.minutes])].sort((a,b)=>a-b);
 return `<section class="panel settings-panel"><div class="panel-body"><div class="panel-head"><div><div class="eyebrow muted" style="margin-bottom:7px">THE PLAN</div><h2>Your event</h2></div><span class="head-icon">${icon('settings')}</span></div><div class="settings-fields"><div class="field"><label for="event-name">Event name</label><input id="event-name" data-setting="name" maxlength="100" value="${esc(s.name)}" autocomplete="off"></div><div class="form-row field"><div><label for="event-rounds">Swiss rounds</label><select id="event-rounds" data-setting="rounds">${options(Array.from({length:12},(_,i)=>i+1),s.settings.rounds)}</select></div><div><label for="event-minutes">Round time</label><select id="event-minutes" data-setting="minutes">${options(durations,s.settings.minutes,' min')}</select></div></div><div class="field"><label for="event-pods">Draft pods</label><select id="event-pods" data-setting="podCount"><option value="0" ${s.settings.podCount===0?'selected':''}>Automatic · around 8 / pod</option>${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${s.settings.podCount===i+1?'selected':''}>${i+1} pod${i?'s':''}</option>`).join('')}</select></div><div class="field"><label for="event-scope">Pair players</label><select id="event-scope" data-setting="scope"><option value="pods" ${s.settings.scope==='pods'?'selected':''}>Within their draft pod</option><option value="event" ${s.settings.scope==='event'?'selected':''}>Across the entire event</option></select><p class="field-note" id="scope-note">${s.settings.scope==='pods'?'Players stay with the people they drafted with.':'Cross-pod play. Announce this before the draft.'}</p></div></div></div></section>`;
}
function setupView(){
 const n=s.players.length,sizes=E.sizesFor(n,s.settings.podCount),byes=s.settings.scope==='pods'?sizes.filter(x=>x%2).length:n%2,hasSeats=n>0&&s.players.every(p=>p.pod!==null);
 return `<div class="layout setup"><div class="stack"><section class="panel"><div class="panel-body"><div class="panel-head"><div><div class="eyebrow muted" style="margin-bottom:7px">01 / REGISTER</div><h2>Who’s at the table?</h2><p>Add a name, press Enter, repeat. Or paste the whole group.</p></div><span class="head-icon">${icon('users')}</span></div><form class="add-player-form" id="add-player-form"><label class="sr-only" for="player-name">Player name</label><input id="player-name" placeholder="Player name…" maxlength="60" autocomplete="off" value="${esc(ui.addName)}" ${n>=64?'disabled':''}><button type="submit" class="btn primary" ${n>=64?'disabled':''}>${icon('plus')} Add</button></form><div class="roster-top"><span class="eyebrow muted">${n.toString().padStart(2,'0')} / 64 PLAYERS</span><button type="button" class="text-btn" data-action="bulk">${icon('plus')} Add many</button></div>${n?`<div class="roster-grid">${s.players.map(p=>rosterItem(p)).join('')}</div>`:`<div class="empty-state"><div class="card-fan" aria-hidden="true"><span></span><span>◇</span><span></span></div><h3>A seat for everyone.</h3><p>A small pod or a full room. Add your players and we’ll handle pairings, byes and the numbers.</p><button type="button" class="text-btn" data-action="demo">Explore a 9-player demo ${icon('arrow')}</button></div>`}${n>1?`<div class="notice ${byes?'gold':''}" style="margin-top:20px">${icon(byes?'coffee':'check')}<div><strong>${byes?`${byes} automatic bye${byes>1?'s':''} per round.`:'Everyone has an opponent.'}</strong><br>${sizes.length} draft pod${sizes.length!==1?'s':''} · ${sizes.join(' + ')} players. ${byes?'Bye recipients are selected fairly from eligible players.':'Based on current attendance.'}</div></div>`:''}</div><div class="start-area"><div><strong>${n<2?'Your table starts here.':hasSeats?'Draft seats are ready.':'Ready for the first pack.'}</strong><p>${n<2?'Add at least 2 players to begin.':hasSeats?'Draft, build, then start the round.':'Make draft seats, or start directly.'}</p></div><div class="button-row">${n>=2?btn(icon('shuffle')+'<span class="optional"> Seats</span>',hasSeats?'view-pods':'seat','','aria-label="'+(hasSeats?'View draft seats':'Make draft seats')+'"'):''}${btn('Start round 1 '+icon('arrow'),'start-round','primary',n<2?'disabled':'')}</div></div></section></div><aside class="sidebar setup-sidebar stack">${setupSettings()}${ruleCard()}</aside></div>`;
}
function rosterItem(p){return `<div class="roster-item">${avatar(p)}<div class="player-info"><div class="player-name">${esc(p.name)}</div>${p.pod?`<div class="player-meta">Pod ${p.pod} · seat ${p.seat}</div>`:''}</div>${btn(icon('edit'),'edit-player','ghost icon-btn',`data-id="${p.id}" aria-label="Edit ${esc(p.name)}" title="Edit player"`)}</div>`;}
function matchCard(m,r){
 const a=findPlayer(m.a),b=m.b?findPlayer(m.b):null;
 if(!b)return `<article class="bye-card" data-match="${m.id}"><div class="bye-left"><span class="avatar">${icon('coffee')}</span><div><div class="player-name"><button type="button" class="name-button" data-action="player-detail" data-id="${a.id}">${esc(a.name)}</button></div><div class="player-meta">BYE${m.pod?' · Pod '+m.pod:''} · no result to enter</div></div></div><div class="bye-score">+3 <small>match points · 2–0 win</small></div></article>`;
 const res=m.result,editable=!s.finished||!!res,winA=res&&res.a>res.b,winB=res&&res.b>res.a;
 const info=(p,points,right,won)=>`<div class="match-player ${right?'right':''} ${won?'winner':''}">${avatar(p)}<div style="min-width:0"><div class="player-name"><button type="button" class="name-button" data-action="player-detail" data-id="${p.id}">${esc(p.name)}</button></div><div class="player-meta">${points} pts before round${!p.active?' · dropped':''}</div></div></div>`;
 return `<article class="match-card ${res?'reported':''}" data-match="${m.id}"><div class="match-top"><span class="table-label">TABLE ${String(m.table).padStart(2,'0')}${m.pod?`<span class="pod-label">/ Pod ${m.pod}</span>`:''}</span><span class="chip ${res?'':'neutral'}">${res?icon('check')+' Reported':'Awaiting result'}</span></div><div class="match-players">${info(a,m.pointsA,false,winA)}<div>${res?`<div class="result-score">${res.a}–${res.b}<div class="result-draws">${res.d?res.d+' drawn game'+(res.d!==1?'s':''):'&nbsp;'}</div></div>`:'<div class="versus">vs.</div>'}</div>${info(b,m.pointsB,true,winB)}</div>${!res&&!s.finished?`<div class="score-buttons">${[[2,0],[2,1],null,[1,2],[0,2]].map(score=>score?`<button type="button" class="score-button" data-action="quick-score" data-id="${m.id}" data-round="${r.number-1}" data-score="${score.join(',')}" aria-label="${esc(score[0]>score[1]?a.name:b.name)} wins; score ${score[0]} to ${score[1]} left to right">${score[0]}–${score[1]}</button>`:`<button type="button" class="score-button more" data-action="report" data-id="${m.id}" data-round="${r.number-1}">Draw / more</button>`).join('')}</div>`:`<div class="match-bottom"><span>${m.repeated?'<span class="chip gold">Rematch approved</span>':res?.kind==='intentional'?'Intentional draw':res?.a===res?.b?'Match drawn':`Win recorded for ${esc(winA?a.name:b.name)}`}</span>${editable?`<button type="button" class="text-btn" data-action="report" data-id="${m.id}" data-round="${r.number-1}">${icon('edit')} Edit</button>`:''}</div>`}${m.repeated&&!res?'<div class="match-bottom"><span class="chip gold">Rematch approved for this round</span></div>':''}</article>`;
}
function pairingsView(){
 if(!s.rounds.length){ui.tab='setup';return setupView();}
 const r=currentRound(),latest=r.id===latestRound().id,done=r.matches.filter(m=>m.result).length,full=E.allReported(r);
 const matches=r.matches.filter(m=>(!ui.pendingOnly||!m.result)&&(!ui.query||[findPlayer(m.a)?.name,findPlayer(m.b)?.name,'table '+m.table,String(m.table)].some(x=>x?.toLowerCase().includes(ui.query.toLowerCase()))));

{matches.length?matches.map(m=>matchCard(m,r)).join(''):`<div class="panel empty-state"><h3>${full&&ui.pendingOnly?'All accounted for.':'No matching tables.'}</h3><p>${full&&ui.pendingOnly?'Every result in this round has been reported.':'Try a different name or clear the filter.'}</p><button type="button" class="text-btn" data-action="clear-filter">Show all tables ${icon('arrow')}</button></div>`}</div>${latest&&full&&!s.finished?`<div class="completion"><div><h3>${s.rounds.length<s.settings.rounds?'Everyone’s in. Next round?':'The last result is in.'}</h3><p>${s.rounds.length<s.settings.rounds?'Review any drops before pairing.':'Finalize the event to see the finishing order.'}</p></div>${s.rounds.length<s.settings.rounds?btn('Pair round '+(s.rounds.length+1)+' '+icon('arrow'),'start-round','lime'):btn('Finish tournament '+icon('trophy'),'finish','lime')}</div>`:''}${latest&&!full?`<p class="aside-note" style="margin-top:14px">Scores read left → right. Tap a score to save it. Use Undo for a misclick.</p>`:''}</section><aside class="sidebar sticky stack">${timerPanel()}${miniStandings()}<div class="aside-note">Pairings prioritize similar match points, not standings tiebreakers. ${r.exact?'This round used exact pairing optimization.':'This larger field used no-rematch matching and local score-gap optimization.'}<br><button type="button" class="text-btn" data-action="settings">${icon('settings')} Event settings</button></div></aside></div>`;
}
function timerPanel(){return `<section class="panel timer-panel"><div class="panel-body"><div class="timer-heading"><span class="eyebrow">ROUND ${s.rounds.length} CLOCK</span>${icon('clock')}</div><div class="clock" data-clock>50:00</div><div class="timer-caption" id="timer-caption"></div><div class="timer-track"><span id="timer-progress"></span></div><div class="timer-actions">${btn(icon(clock?.endAt?'pause':'play')+(clock?.endAt?' Pause timer':' Start timer'),'timer-toggle','lime','id="timer-toggle"')}${btn(icon('reset'),'timer-reset','ghost icon-btn','aria-label="Reset round timer" title="Reset timer"')}</div><div class="sound-line"><span>Runs while you score</span><button type="button" data-action="sound" aria-pressed="${preferences.sound}">${icon(preferences.sound?'volume':'mute')} Sound ${preferences.sound?'on':'off'}</button></div></div></section>`;}
function miniStandings(){const rows=E.standings(s).slice(0,5);return `<section class="panel mini-board"><div class="panel-body"><div class="section-head" style="margin-bottom:4px"><h3>At a glance</h3><span class="chip neutral">Live</span></div>${rows.map(p=>`<div class="mini-standing"><span class="mini-rank">${p.rank}</span><div class="player-info"><div class="player-name"><button type="button" class="name-button" data-action="player-detail" data-id="${p.id}">${esc(p.name)}</button></div><div class="player-meta">${recordText(p)} · ${pct(p.omw)} OMW</div></div><div class="mini-points">${p.points}<small>PTS</small></div></div>`).join('')}<button type="button" class="text-btn" data-action="tab" data-tab="standings" style="margin-top:11px;width:100%;justify-content:space-between">Full standings ${icon('arrow')}</button></div></section>`;}

function standingsTable(rows){return `<div class="table-scroll"><table aria-label="Tournament standings"><thead><tr><th scope="col">Rank</th><th scope="col">Player</th><th scope="col">W–L–D</th><th scope="col">Points</th><th scope="col"><abbr title="Opponents’ match-win percentage">OMW%</abbr></th><th scope="col"><abbr title="Game-win percentage">GW%</abbr></th><th scope="col"><abbr title="Opponents’ game-win percentage">OGW%</abbr></th></tr></thead><tbody>${rows.length?rows.map(p=>`<tr class="${p.rank===1?'leader':''}"><td><span class="rank-marker" title="${p.tied?'Tied after all tiebreakers':'Rank '+p.rank}">${p.rank}${p.tied?'=':''}</span></td><td class="name-cell"><div class="name-row">${avatar(p)}<div><div class="player-name"><button type="button" class="name-button" data-action="player-detail" data-id="${p.id}">${esc(p.name)}</button></div><div class="player-meta">Pod ${p.pod}${p.byes?' · '+p.byes+' bye'+(p.byes!==1?'s':''):''}${!p.active?' · dropped':''}</div></div></div></td><td>${recordText(p)}</td><td class="points-cell">${p.points}</td><td title="${pct(p.omw,6)}">${pct(p.omw)}</td><td title="${pct(p.gwp,6)}">${pct(p.gwp)}</td><td title="${pct(p.ogw,6)}">${pct(p.ogw)}</td></tr>`).join(''):'<tr><td colspan="7" style="text-align:center;padding:28px">No players match this search.</td></tr>'}</tbody></table></div>`;}
function standingsView(){

function openModal(title,body,footerHtml='',wide=false){

 d.className='modal'+(wide?' wide':'');d.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2>${btn(icon('close'),'close-modal','ghost icon-btn','aria-label="Close dialog"')}</div><div class="modal-body">${body}</div>${footerHtml?`<div class="modal-footer">${footerHtml}</div>`:''}`;
 if(!d.open)d.showModal();d.scrollTop=0;setTimeout(()=>{const af=d.querySelector('[autofocus]');if(af)af.focus();},30);
}
function closeModal(){const d=$('#modal');if(d.open)d.close();modalContext=null;confirmCallback=null;if(modalReturn?.isConnected)modalReturn.focus({preventScroll:true});}
function confirmAction(title,body,label,callback,danger=false){confirmCallback=callback;modalContext={type:'confirm'};openModal(esc(title),body,btn('Cancel','close-modal')+btn(esc(label),'confirm',danger?'danger':'primary'));}

function bulkDialog(){modalContext={type:'bulk'};openModal('Everyone, all at once.',`<p>Paste names separated by new lines, commas or semicolons. Duplicate names are skipped.</p><label for="bulk-names" style="margin-top:18px">Player names</label><textarea id="bulk-names" autofocus placeholder="Name1\nName2\nName3\nName4" maxlength="10000"></textarea><p class="field-note">${64-s.players.length} places available. Add an initial to distinguish players with the same name.</p>`,btn('Cancel','close-modal')+btn(icon('plus')+' Add players','save-bulk','primary'));}
function addPlayers(names){
 if(s.rounds.length)throw Error('Registration is closed. Start a new event to change the roster.');
 const unique=[],seen=new Set(s.players.map(p=>normalize(p.name)));let skipped=0;
 for(let name of names){name=safeName(name);if(!name)continue;if(name.length>60)throw Error('Each name must be at most 60 characters.');if(seen.has(normalize(name))){skipped++;continue;}seen.add(normalize(name));unique.push(name);}
 if(!unique.length)throw Error(skipped?'Those players are already registered.':'Enter at least one player name.');
 if(s.players.length+unique.length>64)throw Error('This app supports up to 64 players. No names have been added.');
 const hadSeats=s.players.some(p=>p.pod!==null);ui.addName='';
 change(`Added ${unique.length} player${unique.length!==1?'s':''}: ${unique.join(', ')}.${hadSeats?' Draft seats cleared for the changed roster.':''}`,state=>{state.players.push(...unique.map(E.player));for(const p of state.players){p.pod=null;p.seat=null;}});

}

 if(s.players.some(p=>p.pod!==null))confirmAction('Shuffle the draft seats?',`<p>Everyone will be assigned a new random seat and pod. Do not do this once players have started drafting.</p>`,'Shuffle seats',run);else run();
}
function startRound(force=false,confirmed=false){

 if(!s.rounds.length&&!confirmed){const sizes=E.sizesFor(s.players.length,s.settings.podCount);if(s.players.length<2)throw Error('Add at least two players first.');confirmAction('Start the tournament?',`<p><strong>${esc(s.name)}</strong></p><div class="detail-stats" style="grid-template-columns:repeat(3,1fr);margin-top:18px"><div class="detail-stat"><span>Players</span><b>${s.players.length}</b></div><div class="detail-stat"><span>Rounds</span><b>${s.settings.rounds}</b></div><div class="detail-stat"><span>Minutes / round</span><b>${s.settings.minutes}</b></div></div><div class="notice">${icon('cards')} ${sizes.length} draft pod${sizes.length!==1?'s':''} (${sizes.join(' + ')}). Pairing ${s.settings.scope==='pods'?'within each pod':'across the entire event'}.</div><p style="margin-top:16px">Make sure everyone has finished drafting and building. Registration and draft seats lock when the first round is paired. The round timer starts only when you press Start timer.</p>`,'Pair round 1',()=>startRound(force,true));return;}
 const prepared=clone(s);if(!prepared.rounds.length&&prepared.players.some(p=>p.pod===null))E.seat(prepared);
 let round;try{round=E.pairNext(prepared,force);}catch(e){if(e.code==='REMATCH'){confirmAction('This round needs a decision.',`<div class="notice gold">${icon('alert')} ${esc(e.message)}</div><p style="margin-top:16px">You can finish the event now, or explicitly allow the necessary rematches for this round. Previous opponents are never repeated silently.</p>`,'Allow rematches this round',()=>startRound(true,true));return;}throw e;}
 change(`Paired round ${round.number}: ${round.matches.filter(m=>m.b).length} matches and ${round.matches.filter(m=>!m.b).length} bye(s).${round.warnings.length?' '+round.warnings.join(' '):''}`,state=>{state.players=prepared.players;state.rounds.push(round);clock=newClock();});
 closeModal();ui.tab='pairings';ui.round=s.rounds.length-1;ui.query='';ui.pendingOnly=false;renderAll();window.scrollTo({top:0,behavior:'smooth'});toast(`Round ${round.number} paired. Start the timer when players are ready.`,false,true);
}
function getMatch(ri,id){const r=s.rounds[ri],m=r?.matches.find(m=>m.id===id);if(!m)throw Error('That match is no longer in this tournament.');return {r,m};}
function reportQuick(ri,id,score){const {r,m}=getMatch(ri,id);if(m.result)return reportDialog(ri,id);if(!m.b)throw Error('Byes are already recorded.');if(s.finished)throw Error('Reopen the event to report a new result.');saveResult(ri,id,E.result(score[0],score[1],0));}
function saveResult(ri,id,result){
 const {r,m}=getMatch(ri,id),a=findPlayer(m.a),b=findPlayer(m.b);if(!b)throw Error('A bye cannot be edited.');
 const old=m.result,isCorrection=!!old;change(`${isCorrection?'Corrected':'Reported'} round ${r.number}, table ${m.table}: ${a.name} ${scoreText(result)} ${b.name}${result.kind==='intentional'?' (intentional draw)':''}.${ri<s.rounds.length-1?' Later pairings were kept unchanged.':''}`,()=>{m.result=result;});

function saveReport(){

function clearResult(){if(modalContext?.type!=='report')return;const {ri,id}=modalContext,{r,m}=getMatch(ri,id);if(ri!==s.rounds.length-1||s.finished)throw Error('Only a result in the current, unfinished event can be cleared.');confirmAction('Clear this result?',`<p>Table ${m.table} in round ${r.number} will be marked unreported. Its points and games will be removed until a new result is entered.</p>`,'Clear result',()=>{change(`Cleared result for round ${r.number}, table ${m.table}.`,()=>{m.result=null;});closeModal();toast('Result cleared.',false,true);});}
function playerDetail(id){

function saveSettings(){const name=safeName($('#settings-name').value),rounds=Number($('#settings-rounds').value),minutes=Number($('#settings-minutes').value);if(!name||name.length>100)throw Error('Enter an event name of 1–100 characters.');if(!Number.isInteger(rounds)||rounds<Math.max(1,s.rounds.length)||rounds>12)throw Error('The round count must be between the number already paired and 12.');if(!Number.isInteger(minutes)||minutes<1||minutes>180)throw Error('Round time must be 1–180 minutes.');change('Updated event settings.',()=>{s.name=name;s.settings.rounds=rounds;s.settings.minutes=minutes;});closeModal();toast('Settings saved.',false,true);}
function updateSetupSetting(el){
 const k=el.dataset.setting;let v=k==='name'?safeName(el.value):k==='scope'?el.value:Number(el.value);
 if(s.rounds.length)throw Error('Use Event settings after play begins.');
 if(k==='name'&&(!v||v.length>100)){el.value=s.name;throw Error('Event name must be 1–100 characters.');}
 if(['rounds','minutes','podCount'].includes(k)&&(!Number.isInteger(v)||v<(k==='podCount'?0:1)||v>(k==='rounds'?12:k==='podCount'?8:180)))throw Error('Invalid setting.');
 if(k==='scope'&&!['pods','event'].includes(v))throw Error('Invalid pairing pool.');
 if((k==='name'?s.name:s.settings[k])===v)return;
 const clear=k==='podCount'&&s.players.some(p=>p.pod!==null);
 change(`Changed ${k} to ${v}.${clear?' Draft seats cleared.':''}`,()=>{if(k==='name')s.name=v;else s.settings[k]=v;if(clear)for(const p of s.players){p.pod=null;p.seat=null;}},{render:false});
 if(k==='name'){$('#hero-name').textContent=s.name;document.title=s.name+' · Podkeeper';}else renderAll();
 if(clear)toast('Pod count changed. Generate seats again before drafting.');
}
function finishEvent(){if(!latestRound()||!E.allReported(latestRound()))throw Error('Report every result in the current round first.');confirmAction('Finish this tournament?',`<p>Finalize standings after <strong>${s.rounds.length} round${s.rounds.length!==1?'s':''}</strong>. ${s.rounds.length<s.settings.rounds?'This ends the event before all planned rounds. ':''}You can still review results or reopen the event.</p>`,'Finish tournament',()=>{change(`Finished the tournament after ${s.rounds.length} rounds.`,()=>{s.finished=true;if(clock?.endAt){clock.remaining=remaining();clock.endAt=null;}});closeModal();ui.tab='standings';renderAll();window.scrollTo({top:0,behavior:'smooth'});toast('Tournament complete. Remember to export a backup.',false,true);});}
function reopenEvent(){if(!s.finished)return;confirmAction('Reopen the tournament?',`<p>All rounds and results remain. You can correct results or increase the planned round count in Event settings.</p>`,'Reopen event',()=>{change('Reopened the tournament.',()=>{s.finished=false;});closeModal();ui.tab='pairings';ui.round=s.rounds.length-1;renderAll();toast('Tournament reopened.',false,true);});}
function remaining(){return clock?.endAt!==null&&clock?.endAt!==undefined?clock.endAt-Date.now():clock?.remaining??s.settings.minutes*60000;}
function formatClock(ms){const negative=ms<0,sec=Math.ceil(Math.abs(ms)/1000);return (negative?'+':'')+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function tick(){
 if(!clock)return;const rem=remaining();document.querySelectorAll('[data-clock]').forEach(el=>{el.textContent=formatClock(rem);el.classList.toggle('expired',rem<=0);});
 const cap=$('#timer-caption');if(cap)cap.textContent=rem<=0?'Time called · handle end-of-match turns':clock.endAt?'Timer running · round '+s.rounds.length:rem===clock.total?'Ready when your players are.':'Paused · resume when ready.';
 const bar=$('#timer-progress');if(bar)bar.style.width=Math.max(0,Math.min(100,rem/clock.total*100))+'%';
 if(clock.endAt&&rem<=0&&!clock.notified){clock.notified=true;toast('Round time is up. Handle end-of-match turns at the tables.');if(preferences.sound)beep();if(!conflict&&!blockedRaw){try{ensureLatest();persist();}catch{}}}
}
function timerToggle(){ensureLatest();if(!clock)clock=newClock();if(clock.endAt){clock.remaining=remaining();clock.endAt=null;}else{clock.endAt=Date.now()+clock.remaining;if(preferences.sound)initAudio();}persist();const button=$('#timer-toggle');if(button)button.innerHTML=icon(clock.endAt?'pause':'play')+(clock.endAt?' Pause timer':' Start timer');tick();}
function timerReset(){const run=()=>{ensureLatest();clock=newClock();persist();closeModal();renderAll();toast('Timer reset to '+s.settings.minutes+' minutes.');};if(clock?.endAt||remaining()!==clock?.total)confirmAction('Reset the round timer?',`<p>Replace the current timer with a paused ${s.settings.minutes}-minute countdown.</p>`,'Reset timer',run);else run();}
function initAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();}catch{}}
function beep(){try{initAudio();if(!audio)return;for(let i=0;i<3;i++){const osc=audio.createOscillator(),gain=audio.createGain(),start=audio.currentTime+i*.35;osc.type='sine';osc.frequency.value=740;gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.16,start+.03);gain.gain.exponentialRampToValueAtTime(.001,start+.23);osc.connect(gain);gain.connect(audio.destination);osc.start(start);osc.stop(start+.25);}}catch{}}
function savePrefs(){try{localStorage.setItem(PREF,JSON.stringify(preferences));}catch{}}
function download(name,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function filename(){return (s.name.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-|-$/g,'').slice(0,60).toLowerCase()||'tournament')+'-'+new Date().toISOString().slice(0,10);}
function exportJSON(){download(filename()+'.podkeeper.json',JSON.stringify({format:'podkeeper',version:1,exportedAt:new Date().toISOString(),event:s,clock},null,2));toast('Backup exported. Keep it somewhere safe.');}
function csvCell(x){let str=String(x??'');if(/^[=+@\-\t\r]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"';}
function exportCSV(){const rows=E.standings(s),content=[['Rank','Player','Pod','Active','Wins','Losses','Draws','Match points','OMW%','GW%','OGW%','Byes','Games won','Games lost','Games drawn'],...rows.map(p=>[p.rank,p.name,p.pod,p.active?'Yes':'No',p.wins,p.losses,p.draws,p.points,p.omw===null?'':(p.omw*100).toFixed(6),p.gwp===null?'':(p.gwp*100).toFixed(6),p.ogw===null?'':(p.ogw*100).toFixed(6),p.byes,p.gw,p.gl,p.gd])].map(row=>row.map(csvCell).join(',')).join('\r\n');download(filename()+'-standings.csv','\ufeff'+content,'text/csv;charset=utf-8');toast('Standings exported as CSV.');}
function backupDialog(){
 modalContext={type:'backups'};openModal('Backups & exports',`<p style="margin-bottom:20px">Automatic saving is local to this browser. Export a backup to move devices or keep a permanent copy.</p>${blockedRaw?`<div class="notice red" style="margin-bottom:15px">The saved data could not be validated. Download the raw recovery file before replacing it.</div><div class="backup-option">${icon('file')}<div><h3>Unreadable saved data</h3><p>Original bytes, preserved for recovery.</p></div>${btn('Save raw','export-raw')}</div>`:''}<div class="backup-option">${icon('download')}<div><h3>Full tournament backup</h3><p>Players, pods, rounds, results and event log.</p></div>${btn('Export','export-json','primary')}</div><div class="backup-option">${icon('upload')}<div><h3>Open a backup</h3><p>Import a Podkeeper JSON file.</p></div>${btn('Open','import-json')}</div><div class="backup-option">${icon('file')}<div><h3>Standings spreadsheet</h3><p>All players and tiebreakers, as CSV.</p></div>${btn('CSV','export-csv')}</div><div class="divider"></div><div class="button-row" style="justify-content:space-between">${btn(icon('cards')+' Try demo','demo','ghost')}${btn('New tournament','new-event','danger')}</div><p class="field-note" style="margin-top:15px">Single-device scorekeeping, not cloud sync or official Wizards EventLink. Browser data can be cleared; keep backups.</p>`,btn('Done','close-modal'));
}
async function importFile(file){
 if(!file)return;if(file.size>2*1024*1024)throw Error('The backup is larger than 2 MB. Choose a Podkeeper event export.');
 let data;try{data=JSON.parse(await file.text());}catch{throw Error('This is not a readable JSON backup.');}
 const state=E.validate(data.event??data),c=readClock(data.clock,state);state.demo=demoMode;
 confirmAction('Open this tournament?',`<p><strong>${esc(state.name)}</strong><br>${state.players.length} players · ${state.rounds.length} round(s) · ${state.finished?'finished':'in progress / setup'}.</p><div class="notice gold" style="margin-top:16px">${icon('alert')} This replaces the event currently open in this ${demoMode?'demo':'browser'}. Export it first if needed. The import can be undone.</div>`,'Open backup',()=>{if(blockedRaw){blockedRaw=null;conflict=false;try{lastDisk=localStorage.getItem(key());}catch{}}change('Opened a tournament backup.',()=>{s=state;clock=c||newClock();});closeModal();ui.round=Math.max(0,s.rounds.length-1);ui.tab=s.finished?'standings':s.rounds.length?'pairings':'setup';ui.query='';ui.standingQuery='';ui.podFilter='all';renderAll();toast('Backup opened.',false,true);});
}
function newEvent(){confirmAction('Start a new tournament?',`<p>Your current event will be replaced. Export a backup first to keep a portable copy.</p>${blockedRaw?'<div class="notice red" style="margin-top:15px">This also replaces the unreadable saved data. Save its raw recovery file first.</div>':''}<div style="margin-top:16px">${btn(icon('download')+' Export current event','export-json')}</div>`,'Start new tournament',()=>{if(blockedRaw){blockedRaw=null;conflict=false;try{lastDisk=localStorage.getItem(key());}catch{}}change('Created a new tournament.',()=>{s=E.fresh();s.demo=demoMode;clock=newClock();});closeModal();Object.assign(ui,{tab:'setup',round:0,query:'',standingQuery:'',podFilter:'all',pendingOnly:false,addName:'',board:false});renderAll();toast('New tournament ready.',false,true);});}
function startDemo(){
 if(demoMode){closeModal();return;}
 ensureLatest();realMemory={event:clone(s),clock:clone(clock),history:clone(history),lastDisk,ui:{...ui}};demoMode=true;s=E.fresh();s.name='The Friday Night Nine';s.demo=true;
 s.players=Array.from({length:9},(_,i)=>E.player(`Name${i+1}`));
 let seed=83491;const rng=()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296;};
 E.seat(s,rng);s.rounds.push(E.pairNext(s,false,rng));let i=0;for(const m of s.rounds[0].matches)if(m.b)m.result=E.result(...[[2,1,0],[0,2,0],[1,1,1],[2,0,0]][i++]);s.rounds.push(E.pairNext(s,false,rng));s.rounds[1].matches.filter(m=>m.b)[0].result=E.result(2,1,0);
 s.log=[{at:new Date().toISOString(),message:'Opened a nine-player demo. Round 1 is complete; round 2 is underway.'}];history=[];clock=newClock();clock.remaining=37*60000+42*1000;blockedRaw=null;conflict=false;try{lastDisk=localStorage.getItem(key());}catch{lastDisk=null;}persist();closeModal();Object.assign(ui,{tab:'pairings',round:1,query:'',standingQuery:'',podFilter:'all',pendingOnly:false,board:false});renderAll();window.scrollTo({top:0,behavior:'smooth'});
}
function exitDemo(){
 if(!demoMode)return;demoMode=false;closeModal();if(realMemory){s=realMemory.event;clock=realMemory.clock;history=realMemory.history;lastDisk=realMemory.lastDisk;Object.assign(ui,realMemory.ui);realMemory=null;try{if(localStorage.getItem(STORE)!==lastDisk)conflict=true;}catch{}}else load();renderAll();toast('Back to your own tournament.');
}
function rulesDialog(){modalContext={type:'rules'};openModal('Scoring, without the mystery.',`<div class="rules-section"><h3>The MTG score model</h3><p>Rank by match points, OMW%, GW%, then OGW%. A match win earns 3 points; a draw 1; a loss 0. Game points use the same weights. Match- and game-win percentages have a 33% floor. OMW% and OGW% average the corresponding opponent percentages. Your byes add a 2–0 win but no opponent. An opponent’s own byes remain in their record. An unplayed intentional draw is recorded 0–0–3.</p></div><div class="rules-section"><h3>How this app pairs rounds</h3><p>This is an independent casual-event pairing engine, not an EventLink replica. It prioritizes avoiding rematches, then a low-point bye recipient among the players with the fewest byes, then similar point totals. Ties are randomized. A higher-score bye can be necessary to avoid rematches; it is flagged. No new bye goes to a player while someone in their pool has fewer byes.</p><p style="margin-top:10px">Pools with at most 18 matching vertices use exact minimum-cost pairing. Larger pools use maximum-cardinality no-rematch matching followed by local score-gap improvement, not guaranteed globally optimal score grouping. Unavoidable rematches need explicit approval. Approved rematches count as separate encounters in opponent averages.</p></div><div class="rules-section"><h3>Draft pods & odd attendance</h3><p>Automatic pods aim for around eight players. Sizes are balanced while avoiding unnecessary odd pods. Byes are assigned separately in each pairing pool. In cross-pod mode, the entire event is one pool. Draft seats freeze when round 1 is paired.</p></div><div class="rules-section"><h3>Corrections & practical limits</h3><p>Pending results do not enter standings. All percentages update as results arrive, including opponents who have dropped. Full precision decides ranks; identical criteria produce a shared rank. Correcting a previous round never silently rebuilds later pairings. Drop or rejoin changes eligibility for future rounds only.</p><p style="margin-top:10px">Supports 2–64 players, 1–12 Swiss rounds, individual first-to-two-win matches, timed results and drawn games. No top cut, team matches, penalty administration, double losses or late registration. The timer is a convenience: background browser suspension can delay its sound alert. Only the latest round has a live clock.</p></div><div class="rules-section"><h3>Keep your event safe</h3><p>Everything runs offline, without external scripts, accounts or uploads. Local saves belong to this browser and file/location; private browsing, moving the file or clearing site data can affect them. Export JSON to preserve or transfer an event. Demo mode uses separate storage. The latest 20 event edits can be undone; timer controls are separate.</p></div><div class="notice">${icon('file')}<div>Scoring reference: <a href="${RULES_URL}" target="_blank" rel="noopener noreferrer">Magic Tournament Rules · 27 February 2026</a>, §2.5, §3.1, §7.6 and Appendix C. <a href="https://wpn.wizards.com/en/rules-documents" target="_blank" rel="noopener noreferrer">Check for updates.</a></div></div><p class="field-note" style="margin-top:16px">Shortcuts: / to find a player · ? for help · Ctrl / ⌘ Z to undo outside text fields · Escape to leave display mode.</p>`,btn('Got it','close-modal','primary'),true);}
function renderPrint(view){
 let html=`<h1>${esc(s.name)}</h1>`;
 if(view==='pods'){html+=`<p>Draft seating · ${s.players.length} players · seats clockwise around each table</p>`;for(const pod of [...new Set(s.players.map(p=>p.pod))].filter(Boolean).sort((a,b)=>a-b))html+=`<section><h2>Pod ${pod}</h2><table><thead><tr><th>Seat</th><th>Player</th><th>Status</th></tr></thead><tbody>${s.players.filter(p=>p.pod===pod).sort((a,b)=>a.seat-b.seat).map(p=>`<tr><td>${p.seat}</td><td>${esc(p.name)}</td><td>${p.active?'Active':'Dropped'}</td></tr>`).join('')}</tbody></table></section>`;}
 else if(view==='pairings'&&currentRound()){const r=currentRound();html+=`<p>Round ${r.number} pairings · ${r.activeIds.length} players</p><table><thead><tr><th>Table</th><th>Pod</th><th>Player A</th><th>Player B</th><th>Result A–B</th></tr></thead><tbody>${r.matches.map(m=>`<tr><td>${m.table??'BYE'}</td><td>${m.pod||'All'}</td><td>${esc(findPlayer(m.a).name)}</td><td>${m.b?esc(findPlayer(m.b).name):'BYE — 3 points'}</td><td>${m.result?scoreText(m.result):'____ – ____'}</td></tr>`).join('')}</tbody></table>`;}
 else{html+=`<p>${s.finished?'Final':'Provisional'} standings · after ${s.rounds.length} round(s) · ${s.players.length} players</p><table><thead><tr><th>Rank</th><th>Player</th><th>Pod</th><th>W–L–D</th><th>Points</th><th>OMW%</th><th>GW%</th><th>OGW%</th></tr></thead><tbody>${E.standings(s).map(p=>`<tr><td>${p.rank}${p.tied?'=':''}</td><td>${esc(p.name)}${!p.active?' (dropped)':''}</td><td>${p.pod||'—'}</td><td>${recordText(p)}</td><td>${p.points}</td><td>${pct(p.omw)}</td><td>${pct(p.gwp)}</td><td>${pct(p.ogw)}</td></tr>`).join('')}</tbody></table>`;}
 $('#print-area').innerHTML=html+`<footer>Podkeeper · Generated ${esc(new Date().toLocaleString())} · Match points → OMW% → GW% → OGW%. Equal ranks remain tied.</footer>`;
}
function printView(view){ui.printView=view;renderPrint(view);window.print();}
const handlers={
 'undo':()=>undo(),'theme':()=>{preferences.theme=preferences.theme==='light'?'dark':'light';savePrefs();renderAll();},'backups':backupDialog,'rules':rulesDialog,
 'tab':b=>{ui.tab=b.dataset.tab;renderAll();},'round':b=>{ui.round=Number(b.dataset.round);renderAll();},'bulk':bulkDialog,'save-bulk':()=>addPlayers($('#bulk-names').value.split(/[\n,;]+/)),
 'seat':assignSeats,'view-pods':()=>{ui.tab='pods';renderAll();},'start-round':()=>startRound(),
 'quick-score':b=>reportQuick(Number(b.dataset.round),b.dataset.id,b.dataset.score.split(',').map(Number)),
 'report':b=>reportDialog(Number(b.dataset.round),b.dataset.id),'save-result':saveReport,'clear-result':clearResult,
 'score-preset':b=>{if(modalContext?.type!=='report')return;const [a,v,d]=b.dataset.score.split(',');$('#score-a').value=a;$('#score-b').value=v;$('#score-d').value=d;modalContext.kind=b.dataset.kind||'normal';$('#score-kind').textContent=modalContext.kind==='intentional'?'Intentional draw selected. Use this when no games were played.':'Preset selected. Review the score, then save.';},
 'player-detail':b=>playerDetail(b.dataset.id),'edit-player':b=>editPlayer(b.dataset.id),'save-player':savePlayer,'toggle-player':b=>togglePlayer(b.dataset.id),'remove-player':b=>removePlayer(b.dataset.id),
 'settings':settingsDialog,'save-settings':saveSettings,'finish':finishEvent,'reopen':reopenEvent,
 'pending':()=>{ui.pendingOnly=!ui.pendingOnly;renderAll();},'clear-filter':()=>{ui.pendingOnly=false;ui.query='';renderAll();},
 'timer-toggle':timerToggle,'timer-reset':timerReset,'sound':()=>{preferences.sound=!preferences.sound;savePrefs();if(preferences.sound){initAudio();beep();}renderAll();},
 'export-json':exportJSON,'export-csv':exportCSV,'import-json':()=>{$('#import-file').value='';$('#import-file').click();},'export-raw':()=>{if(blockedRaw)download('podkeeper-recovery-'+Date.now()+'.txt',blockedRaw,'text/plain');},
 'new-event':newEvent,'demo':startDemo,'exit-demo':exitDemo,
 'reload':()=>{closeModal();conflict=false;blockedRaw=null;load();renderAll();toast('Loaded the latest saved event.');},
 'close-modal':closeModal,'confirm':()=>{const cb=confirmCallback;confirmCallback=null;if(cb)cb();},
 'display':()=>{ui.board=!ui.board;ui.tab='pairings';renderAll();},
 'print-pairings':()=>printView('pairings'),'print-standings':()=>printView('standings'),'print-pods':()=>printView('pods')
};
document.addEventListener('click',ev=>{const b=ev.target.closest?.('[data-action]');if(!b||b.disabled)return;const fn=handlers[b.dataset.action];if(!fn)return;try{fn(b);}catch(e){if($('#modal').open&&modalContext?.type!=='confirm')modalError(e.message);else toast(e.message,true);}});
document.addEventListener('submit',ev=>{if(ev.target.id==='add-player-form'){ev.preventDefault();try{addPlayers([$('#player-name').value]);}catch(e){toast(e.message,true);}}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='player-name')ui.addName=el.value;else if(el.id==='match-search'){ui.query=el.value;renderAll();}else if(el.id==='standing-search'){ui.standingQuery=el.value;renderAll();}else if(['score-a','score-b','score-d'].includes(el.id)&&modalContext?.type==='report'){modalContext.kind='normal';$('#score-kind').textContent='Custom result. Review the game totals before saving.';}});
document.addEventListener('change',ev=>{const el=ev.target;try{if(el.dataset.setting)updateSetupSetting(el);if(el.id==='pod-filter'){ui.podFilter=el.value;renderAll();}}catch(e){toast(e.message,true);}});
$('#import-file').addEventListener('change',ev=>{importFile(ev.target.files[0]).catch(e=>{if($('#modal').open)modalError(e.message);else toast(e.message,true);});});
$('#modal').addEventListener('click',ev=>{if(ev.target===$('#modal')){const r=ev.target.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)closeModal();}});
$('#modal').addEventListener('cancel',()=>{modalContext=null;confirmCallback=null;});
document.addEventListener('keydown',ev=>{
 const editing=/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)||ev.target.isContentEditable;
 if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'&&!editing&&!$('#modal').open){ev.preventDefault();try{undo();}catch(e){toast(e.message,true);}}
 else if(ev.key==='/'&&!editing&&!$('#modal').open){ev.preventDefault();($('#match-search')||$('#standing-search')||$('#player-name'))?.focus();}
 else if(ev.key==='?'&&!editing&&!$('#modal').open){ev.preventDefault();rulesDialog();}
 else if(ev.key==='Escape'&&ui.board&&!$('#modal').open){ui.board=false;renderAll();}
 else if(ev.key==='Enter'&&$('#modal').open&&modalContext?.type==='report'&&['score-a','score-b','score-d'].includes(ev.target.id)){ev.preventDefault();try{saveReport();}catch(e){modalError(e.message);}}
});
window.addEventListener('storage',ev=>{if(ev.key===key()&&ev.newValue!==lastDisk){conflict=true;renderBanners();renderSaveState();}});
window.addEventListener('beforeprint',()=>renderPrint(ui.printView||(ui.tab==='pairings'?'pairings':ui.tab==='players'||ui.tab==='pods'?'pods':'standings')));
window.addEventListener('afterprint',()=>{ui.printView=null;});
window.addEventListener('pagehide',()=>{if(!blockedRaw&&!conflict){try{ensureLatest();persist();}catch{}}});
load();renderAll();setInterval(tick,250);
// Read-only inspection hook for local automated tests. No network or telemetry.
window.Podkeeper={version:'1.0.0',getState:()=>clone(s),getClock:()=>clone(clock),getHistoryLength:()=>history.length};
})();
</script>
